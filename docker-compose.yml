services:
  mongo:
    image: mongo:7
    container_name: mongo-portal
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-senha_dev_123}
    volumes:
      - mongo-data:/data/db

volumes:
  mongo-data: